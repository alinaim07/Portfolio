<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ali Naim - Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/Images/My_Photo.svg">
</head>
<body>
  <header>
    <img id="profile-pic" alt="Ali Naim" class="profile-pic">
    <h1 id="name"></h1>
    <p id="moto" class="moto"></p>
    <div class="contact-buttons">
      <a id="whatsapp" target="_blank" class="btn whatsapp">WhatsApp</a>
      <a id="linkedin" target="_blank" class="btn linkedin">LinkedIn</a>
      <a id="email" class="btn email">Email</a>
    </div>
  </header>
  <main>
    <section>
      <h2>CV</h2>
      <div style="text-align: center;">
        <a id="cv-link" target="_blank" class="btn CV" style="margin: 16px auto; display: inline-block;">Download My Latest CV</a>
      </div></div>
    </section>
    <section class="horizontal-section">
      <h2>Professional Experience</h2>
      <button class="arrow left" id="exp-arrow-left" onclick="scrollList('experience-list', -1, 'exp-arrow-left', 'exp-arrow-right')">&#8592;</button>
      <div class="horizontal-list" id="experience-list">
      </div>
      <button class="arrow right" id="exp-arrow-right" onclick="scrollList('experience-list', 1, 'exp-arrow-left', 'exp-arrow-right')">&#8594;</button>
    </section>
    <section class="horizontal-section">
      <h2>Certifications</h2>
      <button class="arrow left" id="certs-arrow-left" onclick="scrollList('certs-list', -1, 'certs-arrow-left', 'certs-arrow-right')">&#8592;</button>
      <div class="horizontal-list" id="certs-list">
      </div>
      <button class="arrow right" id="certs-arrow-right" onclick="scrollList('certs-list', 1, 'certs-arrow-left', 'certs-arrow-right')">&#8594;</button>
    </section>
    <section class="horizontal-section">
      <h2>Honors and Awards</h2>
      <button class="arrow left" id="awards-arrow-left" onclick="scrollList('awards-list', -1, 'awards-arrow-left', 'awards-arrow-right')">&#8592;</button>
      <div class="horizontal-list" id="awards-list">
      </div>
      <button class="arrow right" id="awards-arrow-right" onclick="scrollList('awards-list', 1, 'awards-arrow-left', 'awards-arrow-right')">&#8594;</button>
    </section>
    <section class="horizontal-section">
      <h2>Bug Bounty</h2>
      <button class="arrow left" id="bug-arrow-left" onclick="scrollList('bug-list', -1, 'bug-arrow-left', 'bug-arrow-right')">&#8592;</button>
      <div class="horizontal-list" id="bug-list">
      </div>
      <button class="arrow right" id="bug-arrow-right" onclick="scrollList('bug-list', 1, 'bug-arrow-left', 'bug-arrow-right')">&#8594;</button>
    </section>
    <section class="horizontal-section">
      <h2>Courses</h2>
      <button class="arrow left" id="courses-arrow-left" onclick="scrollList('courses-list', -1, 'courses-arrow-left', 'courses-arrow-right')">&#8592;</button>
      <div class="horizontal-list" id="courses-list">
      </div>
      <button class="arrow right" id="courses-arrow-right" onclick="scrollList('courses-list', 1, 'courses-arrow-left', 'courses-arrow-right')">&#8594;</button>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Ali Naim</p>
  </footer>
  <script>
fetch('data.json')
  .then(response => response.json())
  .then(data => populate(data))
  .catch(error => console.error('Error loading data:', error));

function populate(data) {
  // Profile
  document.getElementById('profile-pic').src = data.profile.photo;
  document.getElementById('name').textContent = data.profile.name;
  document.getElementById('moto').textContent = data.profile.moto;
  document.getElementById('whatsapp').href = data.profile.contacts.whatsapp;
  document.getElementById('linkedin').href = data.profile.contacts.linkedin;
  document.getElementById('email').href = data.profile.contacts.email;

  // CV
  document.getElementById('cv-link').href = data.cv;

  // Experience
  const expList = document.getElementById('experience-list');
  data.experience.forEach(item => {
    const card = createCard(item);
    expList.appendChild(card);
  });

  // Certifications
  const certsList = document.getElementById('certs-list');
  data.certifications.forEach(item => {
    const card = createCard(item);
    certsList.appendChild(card);
  });

  // Awards
  const awardsList = document.getElementById('awards-list');
  data.awards.forEach(item => {
    const card = createCard(item);
    awardsList.appendChild(card);
  });

  // Bug Bounty
  const bugList = document.getElementById('bug-list');
  data.bugBounty.forEach(item => {
    const card = createCard(item);
    bugList.appendChild(card);
  });

  // Courses
  const coursesList = document.getElementById('courses-list');
  data.courses.forEach(item => {
    const card = createCard(item);
    coursesList.appendChild(card);
  });

  // Initialize arrows and fade after populating
  setTimeout(() => {
    updateArrows('experience-list', 'exp-arrow-left', 'exp-arrow-right');
    updateArrows('certs-list', 'certs-arrow-left', 'certs-arrow-right');
    updateArrows('awards-list', 'awards-arrow-left', 'awards-arrow-right');
    updateArrows('bug-list', 'bug-arrow-left', 'bug-arrow-right');
    updateArrows('courses-list', 'courses-arrow-left', 'courses-arrow-right');
    updateCardFade('experience-list');
    updateCardFade('certs-list');
    updateCardFade('awards-list');
    updateCardFade('bug-list');
    updateCardFade('courses-list');
  }, 100);
}

function createCard(item) {
  const card = document.createElement('div');
  card.className = 'card';

  const header = document.createElement('div');
  header.className = 'card-header';
  header.innerHTML = `<strong>${item.title}</strong>`;
  card.appendChild(header);

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.innerHTML = `<span class="card-date">${item.date}</span> <span class="card-org">${item.org}</span>`;
  card.appendChild(meta);

  if (item.rank) {
    const rank = document.createElement('div');
    rank.className = 'card-rank rank';
    rank.textContent = item.rank;
    card.appendChild(rank);
  }

  if (item.details && item.details.length > 0) {
    const ul = document.createElement('ul');
    item.details.forEach(detail => {
      const li = document.createElement('li');
      li.textContent = detail;
      ul.appendChild(li);
    });
    card.appendChild(ul);
  }

  if (item.image) {
    const img = document.createElement('img');
    img.src = item.image;
    img.alt = item.title + ' Certificate';
    img.className = 'certificate-img';
    card.appendChild(img);
  }

  return card;
}
  </script><script>
function scrollList(listId, direction, arrowLeftId, arrowRightId) {
  const list = document.getElementById(listId);
  const cards = Array.from(list.querySelectorAll('.card'));
  const cardWidth = cards[0] ? cards[0].offsetWidth + 32 : 240; // 32px for gap
  const currentScroll = list.scrollLeft;
  const targetScroll = currentScroll + direction * cardWidth;
  list.scrollTo({ left: targetScroll, behavior: 'smooth' });
  setTimeout(() => {
    updateArrows(listId, arrowLeftId, arrowRightId);
    updateCardFade(listId);
  }, 350);
}

function updateArrows(listId, arrowLeftId, arrowRightId) {
  const list = document.getElementById(listId);
  const arrowLeft = document.getElementById(arrowLeftId);
  const arrowRight = document.getElementById(arrowRightId);
  if (list.scrollLeft <= 5) {
    arrowLeft.setAttribute('aria-hidden', 'true');
  } else {
    arrowLeft.setAttribute('aria-hidden', 'false');
  }
  if (list.scrollWidth - list.clientWidth - list.scrollLeft <= 5) {
    arrowRight.setAttribute('aria-hidden', 'true');
  } else {
    arrowRight.setAttribute('aria-hidden', 'false');
  }
}

function updateCardFade(listId) {
  const list = document.getElementById(listId);
  const cards = Array.from(list.querySelectorAll('.card'));
  const listRect = list.getBoundingClientRect();
  const center = listRect.left + listRect.width / 2;
  cards.forEach(card => {
    const cardRect = card.getBoundingClientRect();
    const cardCenter = cardRect.left + cardRect.width / 2;
    if (Math.abs(cardCenter - center) < cardRect.width / 2) {
      card.classList.remove('faded');
    } else {
      card.classList.add('faded');
    }
  });
}

// Initialize arrow visibility and card fade on page load and resize
window.addEventListener('DOMContentLoaded', () => {
  updateArrows('experience-list', 'exp-arrow-left', 'exp-arrow-right');
  updateArrows('certs-list', 'certs-arrow-left', 'certs-arrow-right');
  updateArrows('awards-list', 'awards-arrow-left', 'awards-arrow-right');
  updateArrows('bug-list', 'bug-arrow-left', 'bug-arrow-right');
  updateArrows('courses-list', 'courses-arrow-left', 'courses-arrow-right');
  updateCardFade('experience-list');
  updateCardFade('certs-list');
  updateCardFade('awards-list');
  updateCardFade('bug-list');
  updateCardFade('courses-list');

  document.getElementById('experience-list').addEventListener('scroll', () => {
    updateArrows('experience-list', 'exp-arrow-left', 'exp-arrow-right');
    updateCardFade('experience-list');
  });
  document.getElementById('certs-list').addEventListener('scroll', () => {
    updateArrows('certs-list', 'certs-arrow-left', 'certs-arrow-right');
    updateCardFade('certs-list');
  });
  document.getElementById('awards-list').addEventListener('scroll', () => {
    updateArrows('awards-list', 'awards-arrow-left', 'awards-arrow-right');
    updateCardFade('awards-list');
  });
  document.getElementById('bug-list').addEventListener('scroll', () => {
    updateArrows('bug-list', 'bug-arrow-left', 'bug-arrow-right');
    updateCardFade('bug-list');
  });
  document.getElementById('courses-list').addEventListener('scroll', () => {
    updateArrows('courses-list', 'courses-arrow-left', 'courses-arrow-right');
    updateCardFade('courses-list');
  });
});
window.addEventListener('resize', () => {
  updateArrows('experience-list', 'exp-arrow-left', 'exp-arrow-right');
  updateArrows('certs-list', 'certs-arrow-left', 'certs-arrow-right');
  updateArrows('awards-list', 'awards-arrow-left', 'awards-arrow-right');
  updateArrows('bug-list', 'bug-arrow-left', 'bug-arrow-right');
  updateArrows('courses-list', 'courses-arrow-left', 'courses-arrow-right');
  updateCardFade('experience-list');
  updateCardFade('certs-list');
  updateCardFade('awards-list');
  updateCardFade('bug-list');
  updateCardFade('courses-list');
});
  </script>
</body>
</html>
